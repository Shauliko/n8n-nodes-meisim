# Publishes to npm when a version tag is pushed (v0.1.0, v0.2.0, ...).
# Uses npm trusted publishing (OIDC): configure this repository and workflow
# as the trusted publisher of the package on npmjs.com once; no token needed.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
