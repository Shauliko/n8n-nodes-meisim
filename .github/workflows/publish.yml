# Stages this n8n community node package on npm when a version tag is pushed.
#
# n8n accepts a community node for verification only when it was published by
# GitHub Actions with an npm provenance statement (its rule since May 1 2026).
# The statement lets anyone check that the package was built by this workflow,
# from this repository and this commit.
#
# Sign-in to npm is Trusted Publishing: on npmjs.com the package names this
# repository and this file (publish.yml) as its trusted publisher, and GitHub's
# own identity token is exchanged for a short-lived right. No npm token is
# stored in this repository.
#
# The trusted publisher may stage a version, not publish it. A staged version
# is hidden until a maintainer approves it on npmjs.com (package page, Staged
# Packages, Approve) with two-factor sign-in, so nothing goes public from this
# repository alone. Staging needs npm 11.15.0 or later, which Node 24 has.
#
# To release: set the version in package.json, commit, tag the commit with the
# bare version (0.1.1, not v0.1.1), push the tag, then approve the staged
# version on npmjs.com.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest

    permissions:
      # Needed to get the identity token npm exchanges and signs with.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The tag is the version in package.json
        run: |
          want="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $want"
            exit 1
          fi

      # The development tools need none of their dependencies' install scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # n8n's own check, in strict mode.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # prepublishOnly runs the tests on the fresh build before anything is sent.
      - name: Stage on npm with a provenance statement
        run: npm stage publish --provenance
        env:
          RELEASE_MODE: 'true'
